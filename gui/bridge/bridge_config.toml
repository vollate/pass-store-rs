[tooling]
selected = "flutter_rust_bridge"
version = "2.12.0"
reason = "Use flutter_rust_bridge v2 for generated Dart/Rust bindings instead of maintaining a handwritten transport protocol."

[rust]
crate = "pars-bridge"
entrypoint = "bridge/src/api.rs"
generated = "bridge/src/frb_generated.rs"
depends_on = ["pars-core"]
must_not_depend_on = ["pars-cli"]

[dart]
api = "gui/lib/bridge/pars_bridge_api.dart"
generated = "gui/lib/bridge/frb_generated/api.dart"
methods = [
  "load_config",
  "save_config",
  "list_stores",
  "list_entries",
  "read_entry",
  "copy_entry_password",
  "insert_entry",
  "generate_entry",
  "edit_entry",
  "move_entry",
  "delete_entry",
  "git_status",
  "git_pull",
  "git_push",
  "git_commit",
  "run_git_args",
  "inspect_app_state",
  "select_store",
  "create_local_store",
  "import_local_store",
  "clone_store",
  "remove_store",
  "delete_local_store",
  "list_keys",
  "detect_imported_key",
  "generate_pgp_key",
  "import_pgp_public_key",
  "import_pgp_private_key_file",
  "import_pgp_private_key_text",
  "export_pgp_public_key",
  "export_pgp_private_key",
  "add_pgp_key_to_gpg_id",
  "generate_ssh_key",
  "import_ssh_private_key_file",
  "import_ssh_private_key_text",
  "export_ssh_public_key",
  "export_ssh_private_key",
  "open_github_ssh_settings",
]

[security]
log_request_payloads = false
log_response_payloads = false
secret_fields = ["password", "content", "armored_text", "private_key"]
