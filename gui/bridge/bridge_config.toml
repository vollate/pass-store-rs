[tooling]
selected = "flutter_rust_bridge"
version = "2.12.0"
reason = "Use flutter_rust_bridge v2 for generated Dart/Rust bindings instead of maintaining a handwritten transport protocol."

[rust]
crate = "pars-bridge"
entrypoint = "bridge/src/api.rs"
generated = "bridge/src/frb_generated.rs"
depends_on = ["pars-core"]
must_not_depend_on = ["pars-cli"]

[dart]
api = "gui/lib/bridge/pars_bridge_api.dart"
generated = "gui/lib/bridge/frb_generated/api.dart"
methods = [
  "load_config",
  "save_config",
  "configure_pgp_backend",
  "list_entries",
  "read_entry",
  "copy_entry_password",
  "insert_entry",
  "generate_entry",
  "edit_entry",
  "move_entry",
  "delete_entry",
  "git_status",
  "git_pull",
  "git_push",
  "git_commit",
  "git_list_remotes",
  "git_add_remote",
  "git_set_remote_url",
  "git_remove_remote",
  "run_git_args",
  "inspect_store_git",
  "initialize_git_repository",
  "inspect_app_state",
  "create_local_store",
  "import_local_store",
  "clone_store",
  "disconnect_store",
  "delete_local_store",
  "list_keys",
  "detect_imported_key",
  "generate_pgp_key",
  "inspect_pgp_key_text",
  "inspect_pgp_key_file",
  "import_pgp_key_text",
  "import_pgp_key_file",
  "prepare_pgp_private_key",
  "initialize_store_recipients",
  "generate_ssh_key",
  "import_ssh_private_key_file",
  "import_ssh_private_key_text",
  "export_ssh_public_key",
  "export_ssh_private_key",
  "delete_ssh_key",
  "open_github_ssh_settings",
  "rebuild_autofill_index",
  "upsert_autofill_index_entry",
  "move_autofill_index_entry",
  "remove_autofill_index_entry",
  "patch_autofill_index_favorites",
  "reconcile_autofill_index",
  "enrich_autofill_index_websites",
  "clear_autofill_index_websites",
  "query_autofill_candidates",
  "resolve_autofill_credential",
  "clear_autofill_index",
]

[security]
log_request_payloads = false
log_response_payloads = false
secret_fields = ["password", "passphrase", "content", "armored_text", "private_key", "ssh_private_key_path", "ssh_dir"]
