[print_config]
dir_color = "cyan"
file_color = ""
symbol_color = "bright green"
tree_color = ""
grep_pass_color = "bright green"
grep_match_color = "bright red"

[path_config]
default_repo = "<Your Home>/.password-store"
repos = ["<Your Home>/.password-store"]

[executable_config]
pgp_executable = "gpg2"
editor_executable = "vim"
git_executable = "git"

[pgp_config]
backend = "system_gpg"
pure_rust_enabled = false

[feature_config]
clip_time = 45
fuzzy_search = true
vim_mode = false
exit_on_copy = false
