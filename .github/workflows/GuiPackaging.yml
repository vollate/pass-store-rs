name: GUI packaging

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux Flutter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git libgtk-3-dev ninja-build pkg-config

      - name: Flutter dependencies
        run: flutter pub get
        working-directory: gui

      - name: Flutter analyze
        run: flutter analyze
        working-directory: gui

      - name: Flutter tests
        run: flutter test
        working-directory: gui

  bridge-packaging:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: android
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: ios
            os: macos-latest
          - platform: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git libgtk-3-dev ninja-build pkg-config

      - name: Install Android bridge tools
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk --locked

      - name: Build Linux bridge
        if: matrix.platform == 'linux'
        run: |
          PARS_BRIDGE_PROFILE=release \
          PARS_LINUX_OUTPUT_DIR="$PWD/gui/build/native/linux" \
          bash gui/bridge/build_unix.sh linux
          test -f gui/build/native/linux/libpars_bridge.so

      - name: Build Android bridge
        if: matrix.platform == 'android'
        run: |
          PARS_ANDROID_PROFILE=release \
          PARS_ANDROID_OUTPUT_DIR="$PWD/gui/build/native/android" \
          bash gui/bridge/build_unix.sh android
          test -f gui/build/native/android/arm64-v8a/libpars_bridge.so

      - name: Build macOS bridge framework
        if: matrix.platform == 'macos'
        run: |
          PROJECT_DIR="$PWD/gui/macos" \
          TARGET_BUILD_DIR="$PWD/gui/build/macos-ci" \
          FRAMEWORKS_FOLDER_PATH="Frameworks" \
          CONFIGURATION=Release \
          CODE_SIGNING_ALLOWED=NO \
          bash gui/macos/build_pars_bridge.sh
          test -f gui/build/macos-ci/Frameworks/pars_bridge.framework/pars_bridge

      - name: Build iOS bridge xcframework
        if: matrix.platform == 'ios'
        run: |
          PARS_IOS_PROFILE=release \
          PARS_IOS_OUTPUT_DIR="$PWD/gui/build/native/ios" \
          bash gui/bridge/build_unix.sh ios
          test -d gui/build/native/ios/pars_bridge.xcframework

      - name: Build Windows bridge DLL
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./gui/bridge/build_windows.ps1 -Profile Release -OutputDir "$PWD/gui/build/native/windows"
          if (!(Test-Path "$PWD/gui/build/native/windows/pars_bridge.dll")) {
            throw "pars_bridge.dll missing"
          }

      - name: Flutter release smoke build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release
        working-directory: gui

      - name: Flutter release smoke build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release
        working-directory: gui

      - name: Flutter release smoke build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release
        working-directory: gui

      - name: Flutter release smoke build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release
        working-directory: gui
