[package]
name = "pars-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native bridge layer for the Pars Flutter GUI"
authors = ["Vollate <uint44t@gmail.com>"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pars-core = { path = "../core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.18.0"
