[package]
name = "pars-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native bridge layer for the Pars Flutter GUI"
authors = ["Vollate <uint44t@gmail.com>"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
git2 = { version = "0.20.2", features = ["vendored-libgit2", "vendored-openssl"] }
jni = "0.21.1"
libc = "0.2"
pars-core = { path = "../core" }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "1.1.2"
tempfile = "3.18.0"

[dev-dependencies]
# `test-util` exposes the shared PGP key-material fixtures used by the smoke tests.
pars-core = { path = "../core", features = ["test-util"] }
