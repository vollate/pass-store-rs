[package]
name = "pars-core"
version = "0.2.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pars(a zx2c4-pass compatible passwords manager) core library"
authors = ["Vollate <uint44t@gmail.com>"]
repository = "https://github.com/vollate/pass-store-rs"


[dependencies]
chrono = "0.4.39"
colored = "3.0.0"
fs_extra = "1.3.0"
lazy_static = "1.5.0"
log = "0.4.22"
parking_lot = "0.12.3"
passwords = "3.1.16"
rand = "0.10.1"
regex = "1.11.1"
secrecy = "0.10.3"
tempfile = "3.18.0"
zeroize = "1.8.1"
pgp = "0.20.0"
rand08 = { package = "rand", version = "0.8.6" }
bumpalo = { version = "3.17.0", features = ["collections"] }
walkdir = "2.5.0"
os_pipe = "1.2.1"
clean-path = "0.2.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
dirs = "6.0.0"
anyhow = "1.0.97"
toml = "1.1.2"
unicode-segmentation = "1.12.0"
directories = "6.0.0"
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"

[features]
default = []
# Exposes `util::test_util` so the integration tests under `tests/` can share the same helpers as
# the in-crate unit tests. Not meant for downstream use.
test-util = []

[dev-dependencies]
serial_test = "3.2.0"
pretty_assertions = "1.4.1"
# Self dev-dependency purely to switch on `test-util` for the test targets, so a plain
# `cargo test` still builds the integration tests.
pars-core = { path = ".", features = ["test-util"] }
